<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RotaSegura</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #0b0f14; color: white; }
#splash {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, #0a1322 0%, #0d1b2e 50%, #05080d 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 1000;
}
#splash h1 { color: #34d399; font-size: 32px; margin-bottom: 20px; }
#splash p { color: #cdd6df; font-size: 16px; margin-bottom: 30px; text-align: center; padding: 0 20px; }
#enterBtn {
  background: #34d399; color: #06281c; border: none; padding: 15px 40px;
  font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer;
}
#enterBtn:active { transform: scale(0.95); }
#map { width: 100%; height: 100vh; display: none; }
#app { display: none; padding: 20px; }
#app input {
  width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
  background: #1f2937; color: white; font-size: 16px; margin-bottom: 10px;
}
#app button {
  width: 100%; padding: 12px; background: #1a73e8; color: white;
  border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
}
#status { margin-top: 10px; color: #aaa; font-size: 14px; }
</style>
</head>
<body>

<div id="splash">
  <h1>🛡️ RotaSegura</h1>
  <p>Navegação inteligente com alertas de segurança em tempo real</p>
  <button id="enterBtn">Entrar no RotaSegura</button>
</div>

<div id="map"></div>

<div id="app">
  <h2>Para onde vamos?</h2>
  <input type="text" id="destino" placeholder="Digite o destino (ex: Copacabana, RJ)">
  <button id="buscar">Calcular Rota Segura</button>
  <div id="status"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
console.log('RotaSegura carregado!');

document.getElementById('enterBtn').addEventListener('click', function() {
  console.log('Botão clicado!');
  document.getElementById('splash').style.display = 'none';
  document.getElementById('map').style.display = 'block';
  document.getElementById('app').style.display = 'block';
  
  var map = L.map('map').setView([-22.9068, -43.1729], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);
  
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      map.setView([lat, lng], 15);
      L.marker([lat, lng]).addTo(map).bindPopup('Você está aqui').openPopup();
      document.getElementById('status').textContent = '✅ Localização obtida!';
    }, function(err) {
      document.getElementById('status').textContent = '⚠️ Erro: ' + err.message;
    });
  }
});

document.getElementById('buscar').addEventListener('click', function() {
  var destino = document.getElementById('destino').value;
  if (!destino) {
    document.getElementById('status').textContent = '⚠️ Digite um destino!';
    return;
  }
  document.getElementById('status').textContent = '🔍 Buscando: ' + destino;
});
</script>

</body>
</html>
