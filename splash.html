<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1628">
<title>RotaSegura</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;width:100vw;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a1628}
.splash-container{position:fixed;inset:0;background:url('splash-bg.png') center center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:40px 24px}
.splash-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,.7) 100%)}
.content{position:relative;z-index:10;width:100%;max-width:340px;margin-bottom:60px}
.enter-btn{background:linear-gradient(135deg,#34d399,#10b981);color:#06281c;border:none;padding:20px 48px;font-size:18px;font-weight:800;border-radius:50px;cursor:pointer;width:100%;box-shadow:0 8px 32px rgba(52,211,153,.5);transition:all .2s}
.enter-btn:active{transform:scale(.96)}
.error-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#94a3b8;font-size:16px;text-align:center;z-index:5;display:none}
</style>
</head>
<body>
<div class="splash-container">
  <div class="splash-overlay"></div>
  <div class="error-msg" id="errorMsg">Imagem não carregou<br>Tente recarregar a página</div>
  <div class="content">
    <button class="enter-btn" onclick="enterApp()">Entrar no RotaSegura</button>
  </div>
</div>

<script>
// Verificar se imagem carregou
window.addEventListener('load',function(){
  const container=document.querySelector('.splash-container');
  const bgImage=getComputedStyle(container).backgroundImage;
  
  if(bgImage==='none' || bgImage==='' || bgImage.includes('about:blank')){
    document.getElementById('errorMsg').style.display='block';
    console.log('❌ Imagem de fundo não carregou');
  } else {
    console.log('✅ Imagem carregou com sucesso');
  }
});

function enterApp(){
  // Redirecionar para o app principal
  window.location.href='/index.html';
}

// Auto-redirecionar após 5 segundos (opcional)
// setTimeout(enterApp, 5000);
</script>
</body>
</html>
